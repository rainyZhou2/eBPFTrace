syntax = "proto3";

package etrace.v1;

service IngestService {
  rpc Push(PushRequest) returns (PushResponse);
}

message PushRequest {
  Batch batch = 1;
}

message PushResponse {
  bool duplicate = 1;
}

message Batch {
  string id = 1;
  Resource resource = 2;
  int64 window_start_unix_nano = 3;
  int64 window_end_unix_nano = 4;
  repeated OffCPUSample offcpu = 5;
  repeated OffCPUEvent events = 6;
}

message Resource {
  string node = 1;
  string agent_id = 2;
  string agent_version = 3;
  map<string, string> labels = 4;
}

message Task {
  uint32 pid = 1;
  uint32 tid = 2;
  string comm = 3;
  string container_id = 4;
  Pod pod = 5;
}

message Pod {
  string uid = 1;
  string name = 2;
  string namespace = 3;
  string container = 4;
}

enum FrameKind {
  FRAME_KIND_UNSPECIFIED = 0;
  FRAME_KIND_KERNEL = 1;
  FRAME_KIND_USER = 2;
  // A CUDA kernel a GPU wait was queued behind; an address without a
  // function is the kernel's host stub in the task's process.
  FRAME_KIND_GPU_KERNEL = 3;
}

message Frame {
  uint64 address = 1;
  string function = 2;
  string module = 3;
  FrameKind kind = 4;
}

message Stack {
  repeated Frame frames = 1;
}

message TraceContext {
  bytes trace_id = 1;
  bytes span_id = 2;
}

message Hop {
  Task task = 1;
  Stack wake_stack = 2;
  Stack wait_stack = 3;
  uint64 wait_ns = 4;
  TraceContext trace = 5;
}

enum OffCPUReason {
  OFF_CPU_REASON_UNSPECIFIED = 0;
  OFF_CPU_REASON_BLOCKED = 1;
  OFF_CPU_REASON_PREEMPTED = 2;
  // Time in a CUDA call that waits for GPU work, on or off the CPU.
  OFF_CPU_REASON_GPU = 3;
}

message OffCPUSample {
  Task task = 1;
  Stack stack = 2;
  repeated Hop chain = 3;
  uint64 blocked_ns = 4;
  uint64 count = 5;
  OffCPUReason reason = 6;
}

message OffCPUEvent {
  Task task = 1;
  Stack stack = 2;
  repeated Hop chain = 3;
  int64 start_unix_nano = 4;
  int64 end_unix_nano = 5;
  OffCPUReason reason = 6;
  TraceContext trace = 7;
  // Set for GPU waits: the CUDA stream waited on (0 for the default stream
  // and context-wide waits) and the kernels queued on it since the previous
  // wait on it.
  uint64 gpu_stream = 8;
  uint32 gpu_launches = 9;
}
