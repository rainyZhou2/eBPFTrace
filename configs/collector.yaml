log:
  level: info
  format: json
admin:
  listen: ":9432"
grpc:
  listen: ":4317"
  max_recv_msg_bytes: 16777216
  max_connection_age: 5m
  graceful_timeout: 15s
tokens:
  - ${ETRACE_INGEST_TOKEN}
dedup:
  size: 100000
  ttl: 1h
limits:
  max_samples_per_batch: 200000
  max_events_per_batch: 100000
  max_frames_per_stack: 256
  max_chain_hops: 8
storage:
  driver: clickhouse
  options:
    addrs: ["${CLICKHOUSE_ADDR}"]
    database: etrace
    samples_table: offcpu_samples
    events_table: offcpu_events
    cluster: ${CLICKHOUSE_CLUSTER}
    username: ${CLICKHOUSE_USER}
    password: ${CLICKHOUSE_PASSWORD}
    ttl_days: 7
    auto_migrate: true
