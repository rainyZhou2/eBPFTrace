log:
  level: info
  format: json
admin:
  listen: ":9433"
http:
  listen: ":8080"
auth:
  realm: etrace
  tokens:
    - "${ETRACE_QUERY_TOKEN:?query token is required}"
  basic_user: "${ETRACE_QUERY_USER}"
  basic_password: "${ETRACE_QUERY_PASSWORD}"
rate_limit:
  enabled: true
  rate: 20.0
  burst: 40.0
max_range: 168h
trace_lookback: 24h
max_chain_depth: 4
max_events: 5000
storage:
  driver: clickhouse
  options:
    addrs: ["${CLICKHOUSE_ADDR}"]
    database: etrace
    samples_table: offcpu_samples
    events_table: offcpu_events
    cluster: ${CLICKHOUSE_CLUSTER}
    username: ${CLICKHOUSE_USER}
    password: ${CLICKHOUSE_PASSWORD}
    max_execution_time: 30s
    max_memory_usage: 1073741824
    max_rows_to_group_by: 2000000
    auto_migrate: false
trace_backend:
  driver: jaeger
  options:
    url: ${JAEGER_QUERY_URL}
    timeout: 5s
