[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etrace-otel"
version = "0.1.0"
description = "Attribute eTrace off-CPU time to OpenTelemetry spans"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["opentelemetry-api>=1.20"]

[project.entry-points.opentelemetry_context]
etrace_contextvars_context = "etrace_otel:EtraceRuntimeContext"

[tool.setuptools]
packages = ["etrace_otel"]
